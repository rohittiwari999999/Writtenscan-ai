name: writescan_ai
description: "WriteScan AI - Production-Ready Handwriting to Text Generator Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0

  # Camera & Media
  camera: ^0.10.6
  image_picker: ^1.1.0
  image: ^4.2.0

  # Networking & Real OCR
  http: ^1.2.1
  flutter_dotenv: ^5.1.0
  uuid: ^4.4.0

  # Storage & Caching
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # UI & Material 3
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  flutter_spinkit: ^5.2.1

  # Export & Sharing
  share_plus: ^9.0.0
  pdf: ^3.10.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  mockito: ^5.4.4
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/sample_notes/
